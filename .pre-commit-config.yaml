repos:
  # Hooks generales
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      
  # Formateo de código Java con Spotless
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless Apply
        entry: ./gradlew spotlessApply
        language: system
        pass_filenames: false
        files: \.java$
        
  # Compilación
  - repo: local
    hooks:
      - id: compile
        name: Compile Java
        entry: ./gradlew compileJava
        language: system
        pass_filenames: false
        files: \.java$
        
  # Validación de tests (opcional, comentado por defecto porque puede ser lento)
