version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # kotest modules only work together at the same version
      kotest:
        patterns: ['io.kotest:*']
      # minor and patch bumps land in a single weekly PR
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # kotest 6 and OkHttp 5 need Kotlin 2; the build is still on Kotlin 1.9
      - dependency-name: 'io.kotest:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'com.squareup.okhttp3:*'
        update-types: ['version-update:semver-major']
      # JUnit 6 breaks the test suite (see #22); upgrade it by hand
      - dependency-name: 'org.junit*'
        update-types: ['version-update:semver-major']
      # Gradle 9 needs Kotlin 2 to compile the Kotlin tests (see #32)
      - dependency-name: 'gradle-wrapper'
        update-types: ['version-update:semver-major']
