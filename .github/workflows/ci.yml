# Plugin CI. Tests and the smoke generation run against the templates branch
# of this plugin major (v1 for 1.x), falling back to templates develop (the
# integration branch) until that branch exists. Templates main is frozen for
# the 1.0.x plugins.
name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CORE_DIR: backend-architecture-design-archetype-generator-core
  TEMPLATES_DIR: backend-architecture-design-archetype-generator-templates
  TEMPLATES_REPOSITORY: somospragma/backend-architecture-design-archetype-generator-templates

jobs:
  secrets:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  templates-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ref
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          branch="v${version%%.*}"
          if git ls-remote --exit-code --heads "https://github.com/$TEMPLATES_REPOSITORY" "$branch" > /dev/null; then
            ref=$branch
          else
            ref=develop
            echo "::warning::Templates branch $branch does not exist yet, testing against develop"
          fi
          echo "Templates ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: templates-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.CORE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.CORE_DIR }}
          fetch-depth: 0 # Sonar blame
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEMPLATES_REPOSITORY }}
          ref: ${{ needs.templates-ref.outputs.ref }}
          path: ${{ env.TEMPLATES_DIR }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tests, coverage and dead code
        run: ./gradlew check --console=plain
      - id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=${SONAR_TOKEN:+true}" >> "$GITHUB_OUTPUT"
      - name: SonarCloud
        # Skipped on forks and until SONAR_TOKEN is configured
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew sonar -Dsonar.host.url=https://sonarcloud.io --console=plain
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: ${{ env.CORE_DIR }}/build/reports
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  smoke:
    # The plugin from this PR generates real projects with the templates it reads
    needs: templates-ref
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: hexagonal-multi
            paradigm: imperative
          - architecture: onion-single
            paradigm: reactive
    name: smoke ${{ matrix.architecture }} ${{ matrix.paradigm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.CORE_DIR }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEMPLATES_REPOSITORY }}
          ref: ${{ needs.templates-ref.outputs.ref }}
          path: ${{ env.TEMPLATES_DIR }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - id: gradle
        run: echo "version=$(yq '.gradle' "$TEMPLATES_DIR/templates/versions.yml")" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Publish plugin to mavenLocal
        working-directory: ${{ env.CORE_DIR }}
        run: ./gradlew publishToMavenLocal -x test -x javadoc --console=plain
      - name: Generate and build
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PARADIGM: ${{ matrix.paradigm }}
        run: |
          version=$(sed -n 's/^version=//p' "$CORE_DIR/gradle.properties")
          "$TEMPLATES_DIR/scripts/ci/generate-and-build.sh" --architecture "$ARCHITECTURE" --paradigm "$PARADIGM" \
            --plugin-version "$version" --templates "$TEMPLATES_DIR/templates" --out "$RUNNER_TEMP/generated"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.architecture }}-${{ matrix.paradigm }}
          path: ${{ runner.temp }}/generated/logs
          retention-days: 7

  ci-ok:
    # Single required check for rulesets
    if: always()
    needs: [secrets, build, dependency-review, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [[ $r == success || $r == skipped ]] || exit 1; done
