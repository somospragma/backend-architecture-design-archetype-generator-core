# Publishes the plugin when a vX.Y.Z tag is pushed. The tag version is the
# release version (gradle.properties keeps the next -SNAPSHOT).
#
# verify   the tag is on main (or release/X.x), the build is green and the
#          templates branch vX exists with the schemaVersion this plugin reads.
#          Templates must be published first: a plugin that reads a missing
#          branch fails for every user.
# publish  waits for approval in the `release` environment, which holds the
#          publishing secrets, then publishes and creates the GitHub release
#          with build provenance.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TEMPLATES_REPOSITORY: somospragma/backend-architecture-design-archetype-generator-templates
  CONTRACT: src/main/java/com/pragma/archetype/domain/model/template/TemplatesContract.java

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          major=${version%%.*}
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Eq "origin/(main|release/$major\.x)$"; then
            echo "::error::$TAG is not on main or release/$major.x"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Templates v{major} exists with this plugin's schema
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="v${VERSION%%.*}"
          expected=$(sed -n 's/.*SCHEMA_VERSION = \([0-9]*\);.*/\1/p' "$CONTRACT")
          index=$(curl -fsSL "https://raw.githubusercontent.com/$TEMPLATES_REPOSITORY/$branch/templates/architectures/index.yml") \
            || { echo "::error::Templates branch $branch not found. Publish the templates first."; exit 1; }
          actual=$(yq '.schemaVersion' <<< "$index")
          [[ $actual == "$expected" ]] \
            || { echo "::error::Templates $branch has schemaVersion $actual, this plugin reads $expected"; exit 1; }
          git clone --quiet --depth 1 --branch "$branch" "https://github.com/$TEMPLATES_REPOSITORY" \
            ../backend-architecture-design-archetype-generator-templates
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # a release never reads a cache a PR could have written
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew check -Pversion="$VERSION" --console=plain

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://plugins.gradle.org/plugin/co.com.pragma.archetype-generator
    permissions:
      contents: write # GitHub release
      id-token: write # provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # nothing cached may end up in a published artifact
      - name: Publish to the Gradle Plugin Portal
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins -Pversion="$VERSION" -x test --console=plain
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/libs/*.jar
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/libs/*.jar --verify-tag --generate-notes --title "$TAG"

  maven-central:
    # Optional mirror on Maven Central (repository variable PUBLISH_MAVEN_CENTRAL=true)
    if: vars.PUBLISH_MAVEN_CENTRAL == 'true'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Signed bundle to the Central Portal
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          ORG_GRADLE_PROJECT_signingKey=$(base64 --decode <<< "$GPG_PRIVATE_KEY")
          export ORG_GRADLE_PROJECT_signingKey
          ./gradlew publishPluginMavenPublicationToBuildRepository -Pversion="$VERSION" -x test --console=plain
          (cd build/repo && zip -qr ../../central-bundle.zip .)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -fsS --request POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            --header "Authorization: Bearer $token" --form bundle=@central-bundle.zip
