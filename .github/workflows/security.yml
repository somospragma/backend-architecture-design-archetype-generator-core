# Reusable: secrets in the history and security lint of the workflows themselves
name: Security

on:
  workflow_call:

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.31.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          file=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "$base/$file" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 .

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (checksum verified)
        run: |
          base=https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION
          file=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "$base/$file" -O "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $file\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color
      - name: zizmor
        run: pipx run "zizmor==$ZIZMOR_VERSION" --persona=regular --min-severity=medium .github/workflows
